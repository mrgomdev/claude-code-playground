<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let It Go - Frozen Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg,
                #0a0a2e 0%,
                #1a1a4e 20%,
                #2d1f5e 40%,
                #1e3a5f 60%,
                #0d4f6e 80%,
                #1a6b7c 100%);
            overflow: hidden;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Aurora Borealis Effect */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .aurora::before,
        .aurora::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 60%;
            background: linear-gradient(90deg,
                transparent,
                rgba(100, 200, 255, 0.1),
                rgba(150, 100, 255, 0.15),
                rgba(100, 255, 200, 0.1),
                transparent);
            animation: aurora 8s ease-in-out infinite;
            filter: blur(30px);
        }

        .aurora::after {
            animation-delay: -4s;
            opacity: 0.5;
        }

        @keyframes aurora {
            0%, 100% {
                transform: translateX(-20%) skewX(-5deg);
            }
            50% {
                transform: translateX(20%) skewX(5deg);
            }
        }

        /* Main Title Container */
        .title-container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Let It Go Text */
        .let-it-go {
            font-size: 5rem;
            font-weight: bold;
            color: transparent;
            background: linear-gradient(180deg,
                #ffffff 0%,
                #a8e6ff 30%,
                #7dd3fc 50%,
                #38bdf8 70%,
                #0ea5e9 100%);
            background-clip: text;
            -webkit-background-clip: text;
            text-shadow:
                0 0 20px rgba(56, 189, 248, 0.8),
                0 0 40px rgba(56, 189, 248, 0.6),
                0 0 60px rgba(56, 189, 248, 0.4),
                0 0 80px rgba(56, 189, 248, 0.2);
            animation: glow 3s ease-in-out infinite, float 4s ease-in-out infinite;
            letter-spacing: 0.1em;
        }

        .let-it-go span {
            display: inline-block;
            animation: letterFloat 2s ease-in-out infinite;
        }

        .let-it-go span:nth-child(1) { animation-delay: 0s; }
        .let-it-go span:nth-child(2) { animation-delay: 0.1s; }
        .let-it-go span:nth-child(3) { animation-delay: 0.2s; }
        .let-it-go span:nth-child(4) { animation-delay: 0.3s; }
        .let-it-go span:nth-child(5) { animation-delay: 0.4s; }
        .let-it-go span:nth-child(6) { animation-delay: 0.5s; }
        .let-it-go span:nth-child(7) { animation-delay: 0.6s; }
        .let-it-go span:nth-child(8) { animation-delay: 0.7s; }
        .let-it-go span:nth-child(9) { animation-delay: 0.8s; }

        @keyframes letterFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(2deg);
            }
        }

        @keyframes glow {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 30px rgba(56, 189, 248, 0.8));
            }
            50% {
                filter: brightness(1.2) drop-shadow(0 0 50px rgba(147, 197, 253, 1));
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Subtitle */
        .subtitle {
            font-size: 1.5rem;
            color: rgba(186, 230, 253, 0.8);
            margin-top: 20px;
            letter-spacing: 0.5em;
            animation: fadeInOut 4s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Snowflakes Container */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .snowflake {
            position: absolute;
            top: -20px;
            color: white;
            font-size: 1rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Ice Crystals */
        .ice-crystal {
            position: absolute;
            width: 100px;
            height: 100px;
            pointer-events: none;
            z-index: 2;
        }

        .ice-crystal::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                transparent 40%,
                rgba(147, 197, 253, 0.3) 50%,
                transparent 60%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            animation: crystalPulse 4s ease-in-out infinite;
        }

        .ice-crystal::after {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            background: linear-gradient(135deg,
                transparent 30%,
                rgba(186, 230, 253, 0.2) 50%,
                transparent 70%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            animation: crystalPulse 4s ease-in-out infinite reverse;
        }

        @keyframes crystalPulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        .crystal-1 { top: 10%; left: 5%; transform: rotate(15deg); }
        .crystal-2 { top: 20%; right: 10%; transform: rotate(-30deg); }
        .crystal-3 { bottom: 15%; left: 15%; transform: rotate(45deg); }
        .crystal-4 { bottom: 25%; right: 5%; transform: rotate(-15deg); }
        .crystal-5 { top: 50%; left: 2%; transform: rotate(60deg); }
        .crystal-6 { top: 40%; right: 3%; transform: rotate(-45deg); }

        /* Frost Border */
        .frost-border {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            border: 20px solid transparent;
            border-image: linear-gradient(
                to bottom,
                rgba(186, 230, 253, 0.3),
                transparent 30%,
                transparent 70%,
                rgba(186, 230, 253, 0.3)
            ) 1;
            animation: frostPulse 5s ease-in-out infinite;
        }

        @keyframes frostPulse {
            0%, 100% {
                border-width: 20px;
                opacity: 0.5;
            }
            50% {
                border-width: 25px;
                opacity: 0.8;
            }
        }

        /* Magic Sparkles on Click */
        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: sparkle 1s ease-out forwards;
        }

        @keyframes sparkle {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(180deg);
                opacity: 0;
            }
        }

        /* Elsa Silhouette */
        .elsa-silhouette {
            position: fixed;
            bottom: 50px;
            right: 50px;
            width: 150px;
            height: 200px;
            opacity: 0.15;
            z-index: 3;
            animation: elsaFloat 6s ease-in-out infinite;
        }

        @keyframes elsaFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        /* Ice Ground */
        .ice-ground {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top,
                rgba(147, 197, 253, 0.3),
                transparent);
            z-index: 2;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .let-it-go {
                font-size: 3rem;
            }
            .subtitle {
                font-size: 1rem;
                letter-spacing: 0.3em;
            }
        }

        /* Magic Burst Effect */
        .magic-burst {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #7dd3fc 50%, transparent 70%);
            pointer-events: none;
            animation: burst 0.8s ease-out forwards;
        }

        @keyframes burst {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(20);
                opacity: 0;
            }
        }

        /* Floating Ice Shards */
        .ice-shard {
            position: absolute;
            width: 4px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(186, 230, 253, 0.8), transparent);
            animation: shardFloat 3s ease-in-out infinite;
            z-index: 4;
        }

        @keyframes shardFloat {
            0%, 100% {
                transform: translateY(0) rotate(var(--rotation));
            }
            50% {
                transform: translateY(-30px) rotate(calc(var(--rotation) + 10deg));
            }
        }
    </style>
</head>
<body>
    <div class="aurora"></div>

    <div class="snowflakes" id="snowflakes"></div>

    <div class="ice-crystal crystal-1"></div>
    <div class="ice-crystal crystal-2"></div>
    <div class="ice-crystal crystal-3"></div>
    <div class="ice-crystal crystal-4"></div>
    <div class="ice-crystal crystal-5"></div>
    <div class="ice-crystal crystal-6"></div>

    <div class="title-container">
        <h1 class="let-it-go">
            <span>L</span><span>e</span><span>t</span>
            <span>&nbsp;</span>
            <span>I</span><span>t</span>
            <span>&nbsp;</span>
            <span>G</span><span>o</span>
        </h1>
        <p class="subtitle">THE COLD NEVER BOTHERED ME ANYWAY</p>
    </div>

    <div class="ice-ground"></div>
    <div class="frost-border"></div>

    <!-- Elsa Silhouette SVG -->
    <svg class="elsa-silhouette" viewBox="0 0 100 150" fill="currentColor">
        <path fill="rgba(186, 230, 253, 0.5)" d="M50 10 Q60 20 55 35 Q70 30 65 50 Q80 45 70 70 Q85 80 60 90 L65 140 Q50 145 35 140 L40 90 Q15 80 30 70 Q20 45 35 50 Q30 30 45 35 Q40 20 50 10 Z"/>
        <circle cx="50" cy="20" r="12" fill="rgba(186, 230, 253, 0.5)"/>
    </svg>

    <script>
        // Create snowflakes
        const snowflakesContainer = document.getElementById('snowflakes');
        const snowflakeChars = ['*', '+', '.', '~'];

        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.textContent = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.fontSize = (Math.random() * 1.5 + 0.5) + 'rem';
            snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
            snowflake.style.opacity = Math.random() * 0.5 + 0.3;
            snowflakesContainer.appendChild(snowflake);

            setTimeout(() => {
                snowflake.remove();
            }, 10000);
        }

        // Initial snowflakes
        for (let i = 0; i < 50; i++) {
            setTimeout(() => createSnowflake(), Math.random() * 3000);
        }

        // Continuous snowflakes
        setInterval(createSnowflake, 200);

        // Create ice shards
        function createIceShards() {
            for (let i = 0; i < 15; i++) {
                const shard = document.createElement('div');
                shard.className = 'ice-shard';
                shard.style.left = Math.random() * 100 + 'vw';
                shard.style.top = Math.random() * 100 + 'vh';
                shard.style.setProperty('--rotation', (Math.random() * 360) + 'deg');
                shard.style.animationDelay = (Math.random() * 3) + 's';
                shard.style.height = (Math.random() * 30 + 10) + 'px';
                document.body.appendChild(shard);
            }
        }
        createIceShards();

        // Magic burst on click
        document.addEventListener('click', (e) => {
            // Create main burst
            const burst = document.createElement('div');
            burst.className = 'magic-burst';
            burst.style.left = e.clientX - 5 + 'px';
            burst.style.top = e.clientY - 5 + 'px';
            document.body.appendChild(burst);

            // Create sparkles
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'snowflake';
                sparkle.textContent = '*';
                sparkle.style.left = e.clientX + 'px';
                sparkle.style.top = e.clientY + 'px';
                sparkle.style.fontSize = '1.5rem';
                sparkle.style.position = 'fixed';
                sparkle.style.animation = 'none';
                sparkle.style.transition = 'all 0.8s ease-out';
                sparkle.style.opacity = '1';
                document.body.appendChild(sparkle);

                const angle = (i / 8) * Math.PI * 2;
                const distance = 80 + Math.random() * 40;

                setTimeout(() => {
                    sparkle.style.left = (e.clientX + Math.cos(angle) * distance) + 'px';
                    sparkle.style.top = (e.clientY + Math.sin(angle) * distance) + 'px';
                    sparkle.style.opacity = '0';
                    sparkle.style.transform = 'scale(0.5) rotate(180deg)';
                }, 10);

                setTimeout(() => sparkle.remove(), 800);
            }

            setTimeout(() => burst.remove(), 800);
        });

        // Add keyboard interaction
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                // Create a wave of snowflakes
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => createSnowflake(), i * 50);
                }
            }
        });

        // Console easter egg
        console.log('%c Let It Go!', 'color: #7dd3fc; font-size: 30px; font-weight: bold; text-shadow: 2px 2px 4px #0ea5e9;');
        console.log('%c The cold never bothered me anyway...', 'color: #bae6fd; font-size: 16px; font-style: italic;');
    </script>
</body>
</html>
