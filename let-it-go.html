<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let It Go - Frozen Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg,
                #0a0a2e 0%,
                #1a1a4e 20%,
                #2d1f5e 40%,
                #1e3a5f 60%,
                #0d4f6e 80%,
                #1a6b7c 100%);
            overflow: hidden;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Aurora Borealis Effect */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .aurora::before,
        .aurora::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 60%;
            background: linear-gradient(90deg,
                transparent,
                rgba(100, 200, 255, 0.1),
                rgba(150, 100, 255, 0.15),
                rgba(100, 255, 200, 0.1),
                transparent);
            animation: aurora 8s ease-in-out infinite;
            filter: blur(30px);
        }

        .aurora::after {
            animation-delay: -4s;
            opacity: 0.5;
        }

        @keyframes aurora {
            0%, 100% {
                transform: translateX(-20%) skewX(-5deg);
            }
            50% {
                transform: translateX(20%) skewX(5deg);
            }
        }

        /* Main Title Container */
        .title-container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Let It Go Text */
        .let-it-go {
            font-size: 5rem;
            font-weight: bold;
            color: transparent;
            background: linear-gradient(180deg,
                #ffffff 0%,
                #a8e6ff 30%,
                #7dd3fc 50%,
                #38bdf8 70%,
                #0ea5e9 100%);
            background-clip: text;
            -webkit-background-clip: text;
            text-shadow:
                0 0 20px rgba(56, 189, 248, 0.8),
                0 0 40px rgba(56, 189, 248, 0.6),
                0 0 60px rgba(56, 189, 248, 0.4),
                0 0 80px rgba(56, 189, 248, 0.2);
            animation: glow 3s ease-in-out infinite, float 4s ease-in-out infinite;
            letter-spacing: 0.1em;
        }

        .let-it-go span {
            display: inline-block;
            animation: letterFloat 2s ease-in-out infinite;
        }

        .let-it-go span:nth-child(1) { animation-delay: 0s; }
        .let-it-go span:nth-child(2) { animation-delay: 0.1s; }
        .let-it-go span:nth-child(3) { animation-delay: 0.2s; }
        .let-it-go span:nth-child(4) { animation-delay: 0.3s; }
        .let-it-go span:nth-child(5) { animation-delay: 0.4s; }
        .let-it-go span:nth-child(6) { animation-delay: 0.5s; }
        .let-it-go span:nth-child(7) { animation-delay: 0.6s; }
        .let-it-go span:nth-child(8) { animation-delay: 0.7s; }
        .let-it-go span:nth-child(9) { animation-delay: 0.8s; }

        @keyframes letterFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(2deg);
            }
        }

        @keyframes glow {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 30px rgba(56, 189, 248, 0.8));
            }
            50% {
                filter: brightness(1.2) drop-shadow(0 0 50px rgba(147, 197, 253, 1));
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Subtitle */
        .subtitle {
            font-size: 1.5rem;
            color: rgba(186, 230, 253, 0.8);
            margin-top: 20px;
            letter-spacing: 0.5em;
            animation: fadeInOut 4s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Snowflakes Container */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .snowflake {
            position: absolute;
            top: -20px;
            color: white;
            font-size: 1rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Ice Crystals */
        .ice-crystal {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(147, 197, 253, 0.3);
            transform: rotate(45deg);
            animation: crystalGrow 4s ease-in-out infinite;
        }

        .ice-crystal::before,
        .ice-crystal::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(147, 197, 253, 0.2);
        }

        .ice-crystal::before {
            transform: rotate(30deg);
        }

        .ice-crystal::after {
            transform: rotate(60deg);
        }

        @keyframes crystalGrow {
            0%, 100% {
                transform: rotate(45deg) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: rotate(45deg) scale(1.2);
                opacity: 0.6;
            }
        }

        .crystal-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .crystal-2 { top: 20%; right: 15%; animation-delay: 1s; }
        .crystal-3 { bottom: 30%; left: 5%; animation-delay: 2s; }
        .crystal-4 { bottom: 20%; right: 10%; animation-delay: 1.5s; }

        /* Frost Border Effect */
        .frost-border {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            box-shadow: inset 0 0 100px rgba(147, 197, 253, 0.3),
                        inset 0 0 200px rgba(56, 189, 248, 0.1);
            animation: frostPulse 5s ease-in-out infinite;
        }

        @keyframes frostPulse {
            0%, 100% {
                box-shadow: inset 0 0 100px rgba(147, 197, 253, 0.3),
                            inset 0 0 200px rgba(56, 189, 248, 0.1);
            }
            50% {
                box-shadow: inset 0 0 150px rgba(147, 197, 253, 0.5),
                            inset 0 0 250px rgba(56, 189, 248, 0.2);
            }
        }

        /* Magic Particles */
        .magic-particles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 6;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(147,197,253,0.5) 50%, transparent 100%);
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                transform: scale(0) translateY(0);
                opacity: 0;
            }
            50% {
                transform: scale(1) translateY(-50px);
                opacity: 1;
            }
        }

        /* Elsa Silhouette */
        .elsa-silhouette {
            position: fixed;
            bottom: -10px;
            right: 10%;
            font-size: 15rem;
            opacity: 0.1;
            color: #93c5fd;
            z-index: 3;
            animation: elsaFloat 6s ease-in-out infinite;
        }

        @keyframes elsaFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.02); }
        }

        /* Click instruction */
        .instruction {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(186, 230, 253, 0.6);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            animation: fadeInOut 3s ease-in-out infinite;
            z-index: 20;
        }

        /* Magic Burst Effect */
        .magic-burst {
            position: fixed;
            pointer-events: none;
            z-index: 15;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(147,197,253,0.8) 30%, transparent 70%);
            animation: burst 1s ease-out forwards;
        }

        @keyframes burst {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(10);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Aurora Effect -->
    <div class="aurora"></div>

    <!-- Frost Border -->
    <div class="frost-border"></div>

    <!-- Ice Crystals -->
    <div class="ice-crystal crystal-1"></div>
    <div class="ice-crystal crystal-2"></div>
    <div class="ice-crystal crystal-3"></div>
    <div class="ice-crystal crystal-4"></div>

    <!-- Snowflakes Container -->
    <div class="snowflakes" id="snowflakes"></div>

    <!-- Magic Particles -->
    <div class="magic-particles" id="particles"></div>

    <!-- Main Title -->
    <div class="title-container">
        <h1 class="let-it-go">
            <span>L</span><span>e</span><span>t</span>
            <span>&nbsp;</span>
            <span>I</span><span>t</span>
            <span>&nbsp;</span>
            <span>G</span><span>o</span>
        </h1>
        <p class="subtitle">THE COLD NEVER BOTHERED ME ANYWAY</p>
    </div>

    <!-- Elsa Silhouette -->
    <div class="elsa-silhouette">&#10052;</div>

    <!-- Instruction -->
    <p class="instruction">CLICK ANYWHERE FOR MAGIC</p>

    <script>
        // Snowflake characters
        const snowflakeChars = ['❄', '❅', '❆', '✻', '✼', '❉', '✱'];

        // Create snowflakes
        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            const numSnowflakes = 50;

            for (let i = 0; i < numSnowflakes; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.fontSize = (Math.random() * 1.5 + 0.5) + 'rem';
                snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                snowflake.style.animationDelay = (Math.random() * 10) + 's';
                snowflake.style.opacity = Math.random() * 0.5 + 0.5;
                container.appendChild(snowflake);
            }
        }

        // Create magic particles
        function createParticles() {
            const container = document.getElementById('particles');
            const numParticles = 30;

            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = (Math.random() * 3) + 's';
                particle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(particle);
            }
        }

        // Magic burst on click
        document.addEventListener('click', function(e) {
            // Create burst effect
            const burst = document.createElement('div');
            burst.className = 'magic-burst';
            burst.style.left = (e.clientX - 10) + 'px';
            burst.style.top = (e.clientY - 10) + 'px';
            document.body.appendChild(burst);

            // Create extra snowflakes at click position
            const container = document.getElementById('snowflakes');
            for (let i = 0; i < 5; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = e.clientX + (Math.random() - 0.5) * 100 + 'px';
                snowflake.style.top = e.clientY + 'px';
                snowflake.style.fontSize = (Math.random() * 1.5 + 0.5) + 'rem';
                snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snowflake.style.position = 'fixed';
                container.appendChild(snowflake);

                // Remove after animation
                setTimeout(() => snowflake.remove(), 5000);
            }

            // Remove burst after animation
            setTimeout(() => burst.remove(), 1000);
        });

        // Initialize
        createSnowflakes();
        createParticles();

        // Add continuous snowflakes
        setInterval(() => {
            const container = document.getElementById('snowflakes');
            if (container.children.length < 100) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.fontSize = (Math.random() * 1.5 + 0.5) + 'rem';
                snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(snowflake);

                // Remove after animation completes
                setTimeout(() => snowflake.remove(), 10000);
            }
        }, 300);
    </script>
</body>
</html>
